spring.application.name=bugsphere
# ?? App name ??????????????????????????????????????????


# ?? Database connection ???????????????????????????????
# Your PostgreSQL must be running with a database called bugsphere_db
spring.datasource.url=jdbc:postgresql://localhost:5432/bugsphere_db
spring.datasource.username=postgres          # your postgres username
spring.datasource.password=yourpassword      # your postgres password
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????????????????
# "update" means: auto-create or update tables when app starts (safe for dev)
spring.jpa.hibernate.ddl-auto=update
# Print SQL queries in terminal so you can see what's happening
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? JWT settings ??????????????????????????????????????
# Secret key used to sign tokens ? keep this LONG and private, never share it
jwt.secret=bugsphere_super_secret_key_that_is_very_long_and_secure_2024
# Token expires after 24 hours (in milliseconds: 86400000 = 24 * 60 * 60 * 1000)
jwt.expiration=86400000

# ?? Server ????????????????????????????????????????????
server.port=8080